<!DOCTYPE html>
<html lang="sw" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pro Private</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/theme-light.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/player.css">
  <script src="js/theme.js"></script>
</head>
<body class="player-page">

  <header class="app-header">
    <button class="icon-btn" id="backBtn" aria-label="Rudi">←</button>
    <h1 class="app-title">Muziki</h1>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Badili theme">☀️</button>
      <button class="icon-btn" id="saveBtn" aria-label="Rudisha kwenye simu">⬇️</button>
    </div>
  </header>

  <main class="player-main">
    <div class="player-cover" aria-hidden="true">🎵</div>

    <h2 class="player-title" id="trackTitle">Inapakia...</h2>
    <p class="muted" id="trackCount"></p>

    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Mahali pa wimbo">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>

    <div class="controls">
      <button class="ctrl" id="shuffleBtn" aria-label="Changanya">🔀</button>
      <button class="ctrl" id="prevBtn" aria-label="Iliyotangulia">⏮</button>
      <button class="ctrl big" id="playBtn" aria-label="Cheza">▶</button>
      <button class="ctrl" id="nextBtn" aria-label="Inayofuata">⏭</button>
      <button class="ctrl" id="repeatBtn" aria-label="Rudia">🔁</button>
    </div>
  </main>

  <audio id="audio" preload="auto"></audio>
  <div class="toast" id="toast"></div>

  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <script src="js/media.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
