<!DOCTYPE html>
<html lang="sw" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pro Private</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/theme-light.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pin.css">
  <script src="js/theme.js"></script>
</head>
<body>

  <button class="icon-btn pin-theme" data-theme-toggle aria-label="Badili theme">☀️</button>

  <main class="screen-center">

    <div class="pin-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2.5"></rect>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
        <circle cx="12" cy="15.5" r="1"></circle>
      </svg>
    </div>

    <h1 class="pin-title" id="pinTitle">Pro Private</h1>
    <p class="pin-sub" id="pinSub">Inapakia...</p>

    <div class="pin-dots" id="pinDots" aria-live="polite"></div>
    <p class="pin-msg" id="pinMsg"></p>

    <div class="pin-pad" id="pinPad">
      <button class="pin-key" data-key="1">1</button>
      <button class="pin-key" data-key="2">2</button>
      <button class="pin-key" data-key="3">3</button>
      <button class="pin-key" data-key="4">4</button>
      <button class="pin-key" data-key="5">5</button>
      <button class="pin-key" data-key="6">6</button>
      <button class="pin-key" data-key="7">7</button>
      <button class="pin-key" data-key="8">8</button>
      <button class="pin-key" data-key="9">9</button>
      <span class="pin-key ghost"></span>
      <button class="pin-key" data-key="0">0</button>
      <button class="pin-key" data-key="del" aria-label="Futa tarakimu">⌫</button>
    </div>

  </main>

  <script src="js/crypto.js"></script>
  <script src="js/pin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
